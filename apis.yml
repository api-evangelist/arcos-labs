description: >-
  Arcos Labs is an early-stage, stealth-mode legal technology company focused on
  "rethinking the practice of law." Backed by 8VC as a portfolio company, the firm
  is building software aimed at modernizing legal work, and is currently operating
  in pre-launch / early-access mode with a public waitlist rather than a generally
  available product. As of this profile there is no public developer platform, API,
  documentation, or SDK surface — only a marketing site, a careers page, and an
  early-access intake form. This record was added to the API Evangelist network as
  a VC-portfolio lead and enriched with the identity details the company publishes
  today; API artifacts will be captured if and when Arcos Labs ships a developer
  offering.
